name: Test installer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install test tools
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install shellcheck jq
          else
            sudo apt-get update
            sudo apt-get install --yes shellcheck jq
          fi
      - name: Test with system Bash
        env:
          BASH_BIN: /bin/bash
        run: bash tests/test.sh
